apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.gitlab.nrp-nautilus.io/replace-athena-project/polaris-backend:replace-version
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTH_DISABLED
              value: "false"
            - name: POLARIS_DEPLOYMENT_MODE
              value: cloud
            - name: MCP_ENABLED
              value: "false"
            - name: MCP_ACCESS_MODE
              value: authenticated
            - name: MCP_ALLOWED_HOSTS
              value: polaris-api.replace-athena-namespace.nrp-nautilus.io
            - name: MCP_ALLOWED_ORIGINS
              value: https://polaris-api.replace-athena-namespace.nrp-nautilus.io
            - name: POLARIS_DB_PATH
              value: /data/polaris.db
            - name: POLARIS_RESULTS_DIR
              value: /data/results
            - name: LITERATURE_AGENT_WORK_DIR
              value: /data/literature/outputs
            - name: LITERATURE_AGENT_INTEGRATION_DIR
              value: /data/literature/integration
            - name: LITERATURE_AGENT_MODEL_DIR
              value: /data/literature/models
            - name: LITERATURE_AGENT_KG_DIR
              value: /data/literature/knowledge_graph
            - name: LITERATURE_AGENT_JOB_DIR
              value: /data/literature/jobs
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-secrets
                  key: supabase-jwt-secret
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: polaris-secrets
                  key: huggingface-api-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 10Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: polaris-data
