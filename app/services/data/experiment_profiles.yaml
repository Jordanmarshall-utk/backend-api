profiles:
  bda_bai_6row:
    display_name: "BDAPbI4-FAPbI3 + BAI (A-F, 0/1/5/10/15/20%)"
    source_notebook: "BDAPbI4-FAPbI3 binary + BAI additive.ipynb"
    filename_patterns: ["rp additive 95-120 degrees time evolution"]
    two_d_precursor: "BDAPbI4"
    three_d_precursor: "FAPbI3"
    additive: "BAI"
    rows: [A, B, C, D, E, F]
    additive_percent_by_row: {A: 0, B: 1, C: 5, D: 10, E: 15, F: 20}
    host_stock_molarity: 0.3
    total_volume_ul: 50
    additive_volume_ul: 5
    two_d_spacer_stoichiometry: 1

