apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polaris-api
spec:
  ingressClassName: haproxy
  rules:
    - host: polaris-api.replace-athena-namespace.nrp-nautilus.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: polaris-api
                port:
                  name: http
  tls:
    - hosts:
        - polaris-api.replace-athena-namespace.nrp-nautilus.io
